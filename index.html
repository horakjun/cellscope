<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CellScope</title>
<meta name="description" content="Kontrola baterií Pylontech US2000 / US3000 / US5000 přes konzolový kabel – články, paměť BMS, historie zákazníků a protokol.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Vzhled podle dlaždice „Zdraví baterie“ z Home Assistant (FVE Domov): tmavá modrá, karta se svítícím rámečkem v barvě verdiktu */
:root{
  --bg:#0b1120;--bar:#0f172a;--fg:#e2e8f0;--muted:#94a3b8;--line:rgba(148,163,184,.16);--soft:rgba(255,255,255,.05);--soft2:rgba(255,255,255,.08);
  --ok:#34d399;--warn:#f59e0b;--bad:#ef4444;--blue:#2563eb;--info:#60a5fa;--bal:#a78bfa;--gold:#f59e0b;
  --card:linear-gradient(150deg,rgba(22,32,56,.95),rgba(9,14,28,.95));
  --f:Roboto,"Segoe UI",system-ui,sans-serif;--fm:"Roboto Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--f);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-size:21px;font-weight:500;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12px}
select,input,textarea{font:inherit;color:var(--fg);background:#111a2e;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--blue)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;font:500 14px var(--f);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.tab:disabled{opacity:.4;cursor:default}
.banner{background:rgba(245,158,11,.14);color:#fde68a;font-size:12.5px}
.banner .wrap{padding-block:6px}
main .wrap{padding-block:20px 48px;display:grid;gap:18px}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.wa{color:var(--warn)}.bad{color:var(--bad)}
/* karta jako v HA */
.c,.panel{position:relative;border-radius:16px;background:var(--card);min-width:0}
.c{--c:var(--ok);padding:16px 20px;border:1px solid var(--c);box-shadow:0 0 18px -3px var(--c),0 6px 18px rgba(0,0,0,.35)}
.panel{padding:18px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;gap:12px;align-content:start}
.hero{display:flex;align-items:center;gap:16px}
.pic{width:96px;flex:none}
.pic img{width:100%;display:block;filter:drop-shadow(0 0 10px var(--c))}
.inf{flex:1;min-width:0}
.inf small{display:block;opacity:.6;letter-spacing:.14em;font-size:12px}
.vd{font-size:28px;font-weight:300;color:var(--c);margin:2px 0}
.sb{opacity:.75}
.big{text-align:right;white-space:nowrap}
.big b{font-size:42px;font-weight:500;color:var(--c)}
.big span{opacity:.6}
.kp{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.kp>div{flex:1 1 170px;background:var(--soft);border-radius:12px;padding:9px 12px;min-width:0}
.kp small{display:block;opacity:.6;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.kp b{font-size:20px;font-weight:500}
.kp i{display:block;font-style:normal;opacity:.6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{display:flex;gap:20px;margin-top:14px;align-items:flex-start}
.ch{width:46%;flex:none;min-width:0}
.ch svg{width:100%;display:block}
.ch text,.dt text,svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f)}
.leg{margin-top:5px;font-size:12px;opacity:.75}
.md{display:flex;gap:3px;margin-top:6px}
.md span{flex:1;border-radius:5px;text-align:center;font-size:12px;padding:4px 0;background:#065f46;line-height:1.15;min-width:0;overflow:hidden;cursor:pointer}
.md small{font-size:10px;opacity:.85;white-space:nowrap}
ul.hl{list-style:none;padding:0;margin:0;flex:1;min-width:0}
ul.hl li{display:flex;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)}
ul.hl li:last-child{border-bottom:none}
ul.hl u{text-decoration:none;width:.7em;height:.7em;border-radius:50%;flex:none;margin:.38em .6em 0 0;background:var(--d)}
ul.hl p{flex:1}
.mp{margin-top:14px;background:rgba(255,255,255,.04);border-radius:12px;padding:12px 14px;min-width:0}
.mph{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.mph b.t{font-size:16px;font-weight:500}
.mph span{opacity:.75;flex:1;min-width:200px}
.mph i{font-style:normal;opacity:.6;white-space:nowrap}
.bt{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:5px 12px;border-radius:7px;background:var(--blue);color:#fff;border:0;font:500 13px var(--f)}
.bt:disabled{background:#475569;cursor:default}
.gscroll{overflow-x:auto}
.gr{display:grid;gap:3px}
.gr .hd{cursor:pointer;text-align:center;font-size:12px;padding:3px 0;border-radius:5px;background:var(--soft2);line-height:1.2;border:0;color:inherit;font-family:inherit}
.gr .hd small{display:block;opacity:.6;font-size:10px}
.gr .hd.sel{background:var(--blue)}
.gr .rl{font-size:11px;opacity:.45;text-align:right;padding-right:4px;line-height:1.75}
.gr .ce{cursor:pointer;text-align:center;font-size:11.5px;border-radius:4px;line-height:1.75;color:#f8fafc;font-weight:500;font-variant-numeric:tabular-nums}
.gr .ce.lo{box-shadow:inset 0 0 0 2px #fecaca;font-weight:700}
.gr .ce.hi{box-shadow:inset 0 0 0 2px #fde68a;font-weight:700}
.gr .ce.bl{text-decoration:underline dotted}
.gr .ce.dm{opacity:.35}
.lg{display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12px;opacity:.85}
.lg em{font-style:normal;display:inline-block;width:150px;height:8px;border-radius:4px;margin:0 8px;vertical-align:middle;background:linear-gradient(90deg,hsl(215,90%,42%),hsl(150,55%,36%),hsl(30,90%,45%),hsl(0,90%,45%))}
.dt{margin-top:12px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.dt svg{width:100%;display:block;margin-top:8px}
.x{float:right;cursor:pointer;opacity:.6;padding:0 6px;background:none;border:0;color:inherit;font:inherit}
.tg{display:inline-block;border-radius:5px;padding:0 6px;font-size:12px;color:#0b1220;font-weight:600;white-space:nowrap}
/* obecné prvky */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft2);color:var(--fg);border-radius:8px;padding:8px 14px;font:500 14px var(--f);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:#fca5a5}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row.center{align-items:center}
.spread{justify-content:space-between}
.field{display:grid;gap:4px;min-width:0}
.field>label,.lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.check{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px}
.alert{border-radius:8px;padding:10px 14px;background:rgba(239,68,68,.12);border:1px solid var(--bad);color:#fecaca}
.alert.warn{background:rgba(245,158,11,.12);border-color:var(--warn);color:#fde68a}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;border-radius:14px;padding:14px 18px;border:1px solid var(--c);background:var(--card);box-shadow:0 0 14px -4px var(--c)}
.verdict .pill{grid-row:span 2;font-weight:500;font-size:18px;padding:6px 14px;border-radius:8px;color:#0b1220;background:var(--c)}
.v-ok{--c:var(--ok)}.v-watch{--c:var(--warn)}.v-bad{--c:var(--bad)}
.verdict ul{margin:0;padding-left:18px}
.verdict li.l0{color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
td.num,th.num{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
td.tw{white-space:normal;min-width:200px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--soft2);white-space:nowrap;font-family:var(--f)}
.chip.acc{background:rgba(96,165,250,.16);color:#bfdbfe}.chip.ok{background:rgba(52,211,153,.15);color:var(--ok)}.chip.warn{background:rgba(245,158,11,.16);color:var(--warn)}.chip.bad{background:rgba(239,68,68,.16);color:#fca5a5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.console{background:#060b16;color:#a5d8e6;font:12.5px/1.6 var(--fm);border-radius:10px;padding:12px 14px;min-height:220px;max-height:340px;overflow:auto;white-space:pre-wrap;border:1px solid var(--line)}
.prog{height:6px;background:var(--soft2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
.delta-better{color:var(--ok)}.delta-worse{color:var(--bad)}
.cust{display:grid;gap:8px}
.cust button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;color:inherit}
.cust button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 10px -4px var(--gold)}
.cust small{color:var(--muted)}
.thr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.empty{text-align:center;padding:40px 18px;justify-items:center}
svg.chart .grid{stroke:rgba(255,255,255,.08)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#e2e8f0;color:#0b1220;padding:10px 16px;border-radius:8px;z-index:20;max-width:min(90vw,520px);box-shadow:0 4px 18px rgba(0,0,0,.4)}
/* protokol – papír je vždy světlý */
.sheet{background:#fff;color:#1a1a1a;max-width:794px;width:100%;margin:0 auto;padding:40px 44px;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.4);font-size:12.5px}
.sheet h2{font-size:20px;color:#1a1a1a}.sheet h3{color:#1a1a1a;margin-top:16px}
.sheet .hd{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #b45309;padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
.sheet .logo{max-height:56px;max-width:180px}
.sheet th{color:#666}
.sheet th,.sheet td{border-bottom:1px solid #e2e2e2;padding:5px 8px;font-family:var(--f)}
.sheet .res{padding:10px 12px;border-radius:6px;margin:14px 0;font-weight:500}
.sheet .res.ok{background:#dcf0e3}.sheet .res.watch{background:#f6ead2}.sheet .res.bad{background:#f7dcd8}
.sheet ul{padding-left:18px}
.sheet .sign{display:flex;justify-content:space-between;margin-top:40px;gap:24px;flex-wrap:wrap}
.sheet .sign div{border-top:1px solid #999;padding-top:4px;min-width:220px;color:#666}
.sheet .foot{color:#888;font-size:10.5px;margin-top:22px}
@media (max-width:980px){.mid{flex-direction:column}.ch{width:100%}}
@media (max-width:640px){.hero{flex-wrap:wrap}.pic{width:64px}.vd{font-size:22px}.big{text-align:left;width:100%}.big b{font-size:32px}.verdict{grid-template-columns:1fr}.verdict .pill{grid-row:auto;justify-self:start}.sheet{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  header.top,.banner,.noprint,.toast{display:none!important}
  main .wrap{padding:0;display:block;max-width:none}
  .sheet{box-shadow:none;padding:0;max-width:none;border-radius:0}
  .scroll{overflow:visible}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="7" width="26" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.4"/><rect x="28" y="13" width="4" height="8" rx="1.5" fill="#f59e0b"/><rect x="6" y="11" width="4" height="12" rx="1" fill="#34d399"/><rect x="11.5" y="11" width="4" height="12" rx="1" fill="#34d399"/><rect x="17" y="15" width="4" height="8" rx="1" fill="#f59e0b"/><rect x="22.5" y="11" width="2.5" height="12" rx="1" fill="#34d399"/></svg>
      <div><b>CellScope</b><br><span id="sub"></span></div>
    </div>
    <select id="lang" aria-label="Language"></select>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>
<div class="banner" id="banner" hidden><div class="wrap" id="bannerText"></div></div>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="js/i18n.js"></script>
<script src="js/parse.js"></script>
<script src="js/console.js"></script>
<script src="js/demo.js"></script>
<script src="js/analyse.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
